name: Mirror upstream images

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated image names (empty = all)"
        required: false
        default: ""
        type: string
      suffix:
        description: "Suffix for dest tags"
        required: false
        default: ""
        type: string
      mirror_dry_run:
        description: "Run mirror images to Docker Hub in dry-run mode"
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "mirror-images.yaml"

env:
  IMAGE_PREFIX: ghcr.io/cloudification-io

concurrency:
  group: mirror-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Generate default suffix
        id: suffix
        env:
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: echo "value=${INPUT_SUFFIX:--$(date -u +%Y%m%d)}" >> "$GITHUB_OUTPUT"

      - name: Mirror images
        env:
          IMAGES: ${{ inputs.images }}
          SUFFIX: ${{ steps.suffix.outputs.value }}
        run: ./mirror-to-ghcr.sh

  mirror-to-dockerhub:
    name: Mirror images to Docker Hub
    needs: mirror
    if: >-
      ${{ !cancelled() &&
          contains(fromJson('["success", "failure"]'), needs.mirror.result) &&
          (github.ref == 'refs/heads/main' || inputs.mirror_dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USER:?DOCKERHUB_USERNAME secret is not set}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is not set}"
          skopeo login docker.io -u "$DOCKERHUB_USER" --password-stdin <<< "$DOCKERHUB_TOKEN"

      - name: Mirror images to Docker Hub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.mirror_dry_run }}
          INPUT_IMAGES: ${{ inputs.images }}
        run: |
          IMAGES="${INPUT_IMAGES:-$(yq -r '[.images[].name] | join(",")' mirror-images.yaml)}"
          : "${IMAGES:?refusing to mirror with empty IMAGES}"
          export IMAGES
          ./mirror-to-dockerhub.sh
