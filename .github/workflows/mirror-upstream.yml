name: Mirror upstream images

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated image names (empty = all)"
        required: false
        default: ""
        type: string
      suffix:
        description: "Suffix for dest tags"
        required: false
        default: ""
        type: string
      mirror_dry_run:
        description: "Run mirror images to Docker Hub in dry-run mode"
        default: false
        type: boolean
      force:
        description: "Copy images whose upstream digest is unchanged"
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "mirror-images.yaml"
  schedule:
    # weekly: re-copy tags whose upstream digest changed
    - cron: "0 2 * * 1"

env:
  IMAGE_PREFIX: ghcr.io/cloudification-io

concurrency:
  group: mirror-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    # skopeo >= 1.19 retries registry 502/503/504 responses
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      has_images: ${{ steps.matrix.outputs.has_images }}
    steps:
      - uses: actions/checkout@v7

      - name: Mirror matrix
        id: matrix
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          ROWS=$(./mirror-matrix.sh)
          echo "result=$(jq -c '{include: .}' <<<"$ROWS")" >> "$GITHUB_OUTPUT"
          echo "has_images=$(jq 'length > 0' <<<"$ROWS")" >> "$GITHUB_OUTPUT"

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Generate default suffix
        id: suffix
        env:
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: echo "value=${INPUT_SUFFIX:--$(date -u +%Y%m%d)}" >> "$GITHUB_OUTPUT"

      - name: Mirror images
        env:
          IMAGES: ${{ inputs.images }}
          SUFFIX: ${{ steps.suffix.outputs.value }}
          FORCE: ${{ inputs.force }}
        run: ./mirror-to-ghcr.sh

  scan:
    name: Scan mirrored images
    needs: mirror
    if: >-
      ${{ !cancelled() &&
          contains(fromJson('["success", "failure"]'), needs.mirror.result) &&
          needs.mirror.outputs.has_images == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.mirror.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Resolve image digest
        id: digest
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ matrix.tag }}
        run: |
          DIGEST=$(skopeo inspect --raw --retry-times 3 "docker://$IMAGE" | skopeo manifest-digest /dev/stdin)
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$DIGEST"

      - name: Trivy report
        uses: ./.github/actions/trivy-report
        with:
          name: ${{ matrix.name }}
          tag: ${{ matrix.tag }}
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.digest.outputs.value }}
          digest: ${{ steps.digest.outputs.value }}
          artifact-name: trivy-report-${{ matrix.name }}-${{ matrix.tag }}

  publish-reports:
    needs: scan
    # a failed scan row must not hold back the reports the other rows uploaded
    if: ${{ !cancelled() && contains(fromJson('["success", "failure"]'), needs.scan.result) }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-trivy-reports.yml

  mirror-to-dockerhub:
    name: Mirror images to Docker Hub
    needs: mirror
    if: >-
      ${{ !cancelled() &&
          contains(fromJson('["success", "failure"]'), needs.mirror.result) &&
          (github.ref == 'refs/heads/main' || inputs.mirror_dry_run == true) }}
    # skopeo >= 1.19 retries registry 502/503/504 responses
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USER:?DOCKERHUB_USERNAME secret is not set}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is not set}"
          skopeo login docker.io -u "$DOCKERHUB_USER" --password-stdin <<< "$DOCKERHUB_TOKEN"

      - name: Mirror images to Docker Hub
        env:
          MIRROR_MODE: recent
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.mirror_dry_run }}
          INPUT_IMAGES: ${{ inputs.images }}
        run: |
          IMAGES="${INPUT_IMAGES:-$(yq -r '[.images[].name] | join(",")' mirror-images.yaml)}"
          : "${IMAGES:?refusing to mirror with empty IMAGES}"
          export IMAGES
          ./mirror-to-dockerhub.sh
