name: Build and push custom images

on:
  workflow_dispatch:
    inputs:
      openstack_release:
        description: "OpenStack release"
        required: true
        default: "2025.1"
        type: string
      tools_version:
        description: "openstack-tools version"
        required: true
        default: "1.0"
        type: string
      images:
        description: "Comma-separated image names (empty = all)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "custom-images/**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cloudification-io

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      has_images: ${{ steps.matrix.outputs.has_images }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Use GitHub-provided SHAs for reliable diff (handles merge commits)
          # Fall back to HEAD~1 only if before_sha is zeroed (first push to branch)
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- custom-images/)
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- custom-images/)
          fi

          # Strip "custom-images/" prefix and store as JSON array for jq consumption
          CHANGED_JSON=$(echo "$CHANGED" | sed 's|^custom-images/||' | jq -R -s -c '[split("\n") | .[] | select(length > 0)]')
          echo "files=$CHANGED_JSON" >> "$GITHUB_OUTPUT"
          echo "Changed files:" && echo "$CHANGED_JSON" | jq .

      - name: Build matrix from images.yaml
        id: matrix
        env:
          RELEASE: ${{ inputs.openstack_release || '2025.1' }}
          TOOLS: ${{ inputs.tools_version || '1.0' }}
          FILTER: ${{ inputs.images }}
          EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Read YAML into JSON with all fields including paths
          MATRIX=$(yq -o=json '{
            "include": [.images[] | {
              "name": .name,
              "dockerfile": ("custom-images/" + .dockerfile),
              "context": ("custom-images/" + .context),
              "tag_prefix": .tag_template,
              "release": (.release // ""),
              "paths": (.paths // [])
            }]
          }' custom-images/images.yaml)

          # Compute effective release per image (per-image override wins, else global $release),
          # then substitute {release}/{tools_version} placeholders.
          MATRIX=$(echo "$MATRIX" | jq -c \
            --arg release "$RELEASE" \
            --arg tools "$TOOLS" \
            '.include |= [.[] |
              ((if .release == "" then $release else .release end) as $eff |
               .effective_release = $eff |
               .tag_prefix |= (gsub("{release}"; $eff) | gsub("{tools_version}"; $tools)) |
               .dockerfile |= gsub("{release}"; $eff) |
               .context |= gsub("{release}"; $eff))]')

          # Filter by image names if requested (workflow_dispatch)
          if [ -n "$FILTER" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c --arg f "$FILTER" '
              .include |= [.[] | select(
                .name as $n | ($f | split(",") | map(gsub("\\s";"")) | index($n)) != null
              )]')
          fi

          # Filter by changed paths on push events
          if [ "$EVENT" = "push" ]; then
            CHANGED="$CHANGED_FILES"

            # If images.yaml itself changed, rebuild everything
            if echo "$CHANGED" | jq -e 'any(. == "images.yaml")' > /dev/null 2>&1; then
              echo "images.yaml changed — rebuilding all images"
            else
              # Keep only images where at least one changed file starts with one of the image's paths
              MATRIX=$(echo "$MATRIX" | jq -c --argjson changed "$CHANGED" '
                .include |= [.[] | select(
                  .paths as $paths |
                  any($changed[]; . as $file |
                    any($paths[]; . as $p | ($file | startswith($p)))
                  )
                )]')
            fi
          fi

          # Remove paths and raw release field from final matrix (build job consumes effective_release)
          MATRIX=$(echo "$MATRIX" | jq -c '.include |= [.[] | del(.paths, .release)]')

          IMAGE_COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "Images to build: $IMAGE_COUNT"
          echo "$MATRIX" | jq -r '.include[].name'

          if [ "$IMAGE_COUNT" -gt 0 ]; then
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi
          echo "result=$(echo "$MATRIX" | jq -c)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: needs.setup.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp tag
        id: tag
        env:
          TAG_PREFIX: ${{ matrix.tag_prefix }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "full_tag=${TAG_PREFIX}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.full_tag }}
            type=raw,value=${{ matrix.tag_prefix }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENSTACK_RELEASE=${{ matrix.effective_release }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: template
          template: "@.github/trivy/html.tpl"
          output: trivy-report-${{ matrix.name }}.html
          scanners: vuln

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.name }}
          path: trivy-report-${{ matrix.name }}.html

      - name: Add to job summary
        env:
          IMAGE_NAME: ${{ matrix.name }}
          FULL_TAG: ${{ steps.tag.outputs.full_tag }}
        run: |
          echo "### ${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_PREFIX}/${IMAGE_NAME}:${FULL_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
