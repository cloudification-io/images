name: Build and push custom images

on:
  workflow_dispatch:
    inputs:
      openstack_release:
        description: "OpenStack release filter (empty = all; a value also drops images without releases, e.g. ceph)"
        required: false
        default: ""
        type: string
      images:
        description: "Comma-separated image names (empty = all)"
        required: false
        default: ""
        type: string
      mirror_dry_run:
        description: "Run mirror images to Docker Hub in dry-run mode"
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "custom-images/**"
  schedule:
    # weekly: rebuild rows whose upstream base image digest changed
    - cron: "0 3 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cloudification-io

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    # skopeo >= 1.19 retries registry 502/503/504 responses
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      has_images: ${{ steps.matrix.outputs.has_images }}
      names: ${{ steps.matrix.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install skopeo
        if: github.event_name == 'schedule'
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Log in to ghcr.io
        if: github.event_name == 'schedule'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Log in to Docker Hub
        if: github.event_name == 'schedule' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: skopeo login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin <<< "$DOCKERHUB_TOKEN"

      - name: Detect changed files
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # Use GitHub-provided SHAs for reliable diff (handles merge commits)
          # Fall back to HEAD~1 only if before_sha is zeroed (first push to branch)
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- custom-images/)
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- custom-images/)
          fi

          # Strip "custom-images/" prefix and store as JSON array for jq consumption
          CHANGED_JSON=$(echo "$CHANGED" | sed 's|^custom-images/||' | jq -R -s -c '[split("\n") | .[] | select(length > 0)]')
          echo "files=$CHANGED_JSON" >> "$GITHUB_OUTPUT"
          echo "Changed files:" && echo "$CHANGED_JSON" | jq .

      - name: Build matrix from images.yaml
        id: matrix
        env:
          OPENSTACK_RELEASE: ${{ inputs.openstack_release }}
          IMAGES: ${{ inputs.images }}
          EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          # One row per (image, release); dispatch filters are applied by the script
          ROWS=$(custom-images/matrix.sh)
          ROWS=$(echo "$ROWS" | jq -c '[.[] |
            .dockerfile |= ("custom-images/" + .) |
            .context |= ("custom-images/" + .)]')

          # Filter by changed paths on push events
          if [ "$EVENT" = "push" ]; then
            CHANGED="$CHANGED_FILES"

            # If images.yaml itself changed, rebuild everything
            if echo "$CHANGED" | jq -e 'any(. == "images.yaml")' > /dev/null 2>&1; then
              echo "images.yaml changed — rebuilding all images"
            else
              # Keep only rows where at least one changed file starts with one of the image's paths
              ROWS=$(echo "$ROWS" | jq -c --argjson changed "$CHANGED" '
                [.[] | select(
                  .paths as $paths |
                  any($changed[]; . as $file |
                    any($paths[]; . as $p | ($file | startswith($p)))
                  )
                )]')
            fi
          fi

          # On schedule, keep only rows whose base image digest differs from the
          # one recorded on our last clean tag (org.opencontainers.image.base.digest)
          if [ "$EVENT" = "schedule" ]; then
            source ./mirror-lib.sh
            declare -A UPSTREAM
            DECISIONS='[]'
            while IFS=$'\t' read -r row_id name tag_prefix base_image; do
              upstream=""; recorded=""; keep=false; reason="no base_image"
              if [ -n "$base_image" ]; then
                if [ -z "${UPSTREAM[$base_image]:-}" ]; then
                  UPSTREAM[$base_image]=$(get_manifest_digest "$base_image")
                  [ -n "${UPSTREAM[$base_image]}" ] || { echo "ERROR: base image $base_image not found" >&2; exit 1; }
                fi
                upstream=${UPSTREAM[$base_image]}
                recorded=$(get_image_label "${IMAGE_PREFIX}/${name}:${tag_prefix}" org.opencontainers.image.base.digest)
                if [ -z "$recorded" ]; then keep=true; reason="tag or label missing"
                elif [ "$recorded" != "$upstream" ]; then keep=true; reason="base changed"
                else reason="up to date"; fi
              fi
              DECISIONS=$(jq -c --arg id "$row_id" --arg u "$upstream" --arg r "$recorded" --argjson k "$keep" --arg why "$reason" \
                '. + [{row_id:$id, upstream:$u, recorded:$r, keep:$k, reason:$why}]' <<<"$DECISIONS")
            done < <(jq -r '.[] | [.row_id, .name, .tag_prefix, .base_image] | @tsv' <<<"$ROWS")

            ROWS=$(jq -c --argjson d "$DECISIONS" \
              '($d | map(select(.keep) | .row_id)) as $k | [.[] | select(.row_id as $r | $k | index($r) != null)]' <<<"$ROWS")

            {
              echo "### Base image digest check"
              echo "| row | upstream | recorded | decision |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.row_id) | \(.upstream[7:19]) | \(.recorded[7:19]) | \(if .keep then "rebuild" else "skip" end) (\(.reason)) |"' <<<"$DECISIONS"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          MATRIX=$(echo "$ROWS" | jq -c '{include: [.[] | del(.paths)]}')

          IMAGE_COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "Rows to build: $IMAGE_COUNT"
          echo "$MATRIX" | jq -r '.include[].row_id'

          if [ "$IMAGE_COUNT" -gt 0 ]; then
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi
          echo "result=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "names=$(echo "$MATRIX" | jq -r '[.include[].name] | unique | join(",")')" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    if: needs.setup.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve base image digest
        id: base
        if: matrix.base_image != ''
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
        run: |
          DIGEST=$(skopeo inspect --raw --retry-times 3 "docker://$BASE_IMAGE" | skopeo manifest-digest /dev/stdin)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$BASE_IMAGE@$DIGEST"

      - name: Generate timestamp tag
        id: tag
        env:
          TAG_PREFIX: ${{ matrix.tag_prefix }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "full_tag=${TAG_PREFIX}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.full_tag }}
            type=raw,value=${{ matrix.tag_prefix }}
          labels: |
            ${{ matrix.base_image && format('org.opencontainers.image.base.name={0}', matrix.base_image) || '' }}
            ${{ steps.base.outputs.digest && format('org.opencontainers.image.base.digest={0}', steps.base.outputs.digest) || '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.release && format('OPENSTACK_RELEASE={0}', matrix.release) || '' }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.row_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.row_id }}

      - name: Prepare Trivy report directory
        run: mkdir -p "trivy-reports/${{ matrix.name }}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-reports/${{ matrix.name }}/report.json
          scanners: vuln

      - name: Install scan2html plugin
        run: trivy plugin install scan2html

      - name: Generate interactive Trivy report
        run: |
          trivy scan2html generate \
            --scan2html-flags \
            --output "trivy-reports/${{ matrix.name }}/index.html" \
            --from "trivy-reports/${{ matrix.name }}/report.json"

      - name: Generate Trivy report metadata
        run: |
          python3 .github/scripts/create_trivy_metadata.py \
            --report-dir "trivy-reports/${{ matrix.name }}" \
            --image "${{ matrix.name }}" \
            --tag "${{ steps.tag.outputs.full_tag }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --image-reference "${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ matrix.row_id }}
          path: trivy-reports/${{ matrix.name }}

      - name: Add to job summary
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ROW_ID: ${{ matrix.row_id }}
          FULL_TAG: ${{ steps.tag.outputs.full_tag }}
        run: |
          echo "### ${ROW_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE_PREFIX}/${IMAGE_NAME}:${FULL_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish-reports:
    needs: [setup, build]
    if: needs.setup.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Trivy reports
        uses: actions/download-artifact@v8
        with:
          pattern: trivy-report-*
          path: trivy-reports

      - name: Checkout GitHub Pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Prepare GitHub Pages content
        run: |
          custom-images/matrix.sh | jq -r '.[] | "\(.name) \(.tag_prefix)"' > live-tags.txt
          python3 .github/scripts/publish-trivy-reports.py \
            --input-dir trivy-reports \
            --site-dir site \
            --keep 10 \
            --live-tags live-tags.txt

      - name: Configure Git
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Show Git status
        working-directory: site
        run: |
          git status

      - name: Commit GitHub Pages changes
        working-directory: site
        run: |
          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Trivy reports"
          git push origin HEAD:gh-pages

  mirror-to-dockerhub:
    name: Mirror images to Docker Hub
    needs:
      - setup
      - build
    if: >-
      ${{ !cancelled() &&
          needs.setup.outputs.has_images == 'true' &&
          contains(fromJson('["success", "failure"]'), needs.build.result) &&
          (github.ref == 'refs/heads/main' || inputs.mirror_dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<< "$GHCR_TOKEN"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USER:?DOCKERHUB_USERNAME secret is not set}"
          : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN secret is not set}"
          skopeo login docker.io -u "$DOCKERHUB_USER" --password-stdin <<< "$DOCKERHUB_TOKEN"

      - name: Mirror images to Docker Hub
        env:
          MIRROR_MODE: recent
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.mirror_dry_run }}
          IMAGES: ${{ needs.setup.outputs.names }}
        run: |
          : "${IMAGES:?refusing to mirror with empty IMAGES}"
          ./mirror-to-dockerhub.sh
