# OpenStack components — ubuntu_noble base from quay.io/airshipit
images:
  - name: horizon
    dockerfile: horizon/Dockerfile
    context: horizon
    tag_template: "{release}-ubuntu_noble"
    release: "2026.1"
    paths:
      - horizon/

  - name: nova
    dockerfile: nova/Dockerfile
    context: nova
    tag_template: "{release}-ubuntu_noble"
    paths:
      - nova/

  - name: octavia
    dockerfile: octavia/Dockerfile
    context: octavia
    tag_template: "{release}-ubuntu_noble"
    paths:
      - octavia/

  - name: masakari
    dockerfile: masakari/Dockerfile
    context: masakari
    tag_template: "{release}-ubuntu_noble"
    paths:
      - masakari/

  - name: masakari-monitors
    dockerfile: masakari-monitors/Dockerfile
    context: masakari-monitors
    tag_template: "{release}-ubuntu_noble"
    paths:
      - masakari-monitors/

  - name: cinder
    dockerfile: cinder/Dockerfile
    context: cinder
    tag_template: "{release}-ubuntu_noble"
    paths:
      - cinder/

  - name: glance
    dockerfile: glance/Dockerfile
    context: glance
    tag_template: "{release}-ubuntu_noble"
    paths:
      - glance/

  - name: keystone
    dockerfile: keystone/Dockerfile
    context: keystone
    tag_template: "{release}-ubuntu_noble"
    paths:
      - keystone/

  - name: neutron
    dockerfile: neutron/Dockerfile
    context: neutron
    tag_template: "{release}-ubuntu_noble"
    paths:
      - neutron/

  - name: cloudkitty
    dockerfile: cloudkitty/Dockerfile
    context: cloudkitty
    tag_template: "{release}-ubuntu_noble"
    release: "2026.1"
    paths:
      - cloudkitty/

  - name: designate
    dockerfile: designate/Dockerfile
    context: designate
    tag_template: "{release}-ubuntu_noble"
    paths:
      - designate/

  - name: barbican
    dockerfile: barbican/Dockerfile
    context: barbican
    tag_template: "{release}-ubuntu_noble"
    paths:
      - barbican/

  - name: heat
    dockerfile: heat/Dockerfile
    context: heat
    tag_template: "{release}-ubuntu_noble"
    paths:
      - heat/

  - name: placement
    dockerfile: placement/Dockerfile
    context: placement
    tag_template: "{release}-ubuntu_noble"
    paths:
      - placement/

  - name: manila
    dockerfile: manila/Dockerfile
    context: manila
    tag_template: "{release}-ubuntu_noble"
    paths:
      - manila/

  - name: libvirt
    dockerfile: libvirt/Dockerfile
    context: libvirt
    tag_template: "{release}-ubuntu_noble"
    paths:
      - libvirt/

  # OVS uses a fixed "latest" base tag — not tied to a specific OpenStack release
  - name: openvswitch
    dockerfile: openvswitch/Dockerfile
    context: openvswitch
    tag_template: "latest-ubuntu_noble"
    paths:
      - openvswitch/

  # Gnocchi sources from quay.io/openstack.kolla (airshipit image doesn't exist) — uses dash, not underscore
  - name: gnocchi-api
    dockerfile: gnocchi-api/Dockerfile
    context: gnocchi-api
    tag_template: "{release}-ubuntu-noble"
    release: "2026.1"
    paths:
      - gnocchi-api/

  - name: gnocchi-metricd
    dockerfile: gnocchi-metricd/Dockerfile
    context: gnocchi-metricd
    tag_template: "{release}-ubuntu-noble"
    release: "2026.1"
    paths:
      - gnocchi-metricd/

  # Standalone builds — different base images and versioning
  - name: openstack-tools
    dockerfile: openstack-tools/Dockerfile
    context: openstack-tools
    tag_template: "{tools_version}-{release}"
    paths:
      - openstack-tools/
