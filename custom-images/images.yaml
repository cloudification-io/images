# Custom image definitions, consumed by matrix.sh (local builds and CI).
#
#   releases:   OpenStack releases to build; one row per release. Required when
#               {release} appears in tag_template, dockerfile, context or base_image.
#   base_image: final-stage FROM image; {release} is substituted. The weekly CI
#               schedule rebuilds a row when this image's digest changed since the
#               last build. Images without it are never rebuilt by the schedule.
#
# ARG OPENSTACK_RELEASE defaults inside the Dockerfiles only matter for bare
# docker build; matrix.sh always passes the release from this file.
#
# OpenStack components — ubuntu_noble base from quay.io/airshipit
images:
  - name: horizon
    dockerfile: horizon/Dockerfile
    context: horizon
    tag_template: "{release}-ubuntu_noble"
    releases: ["2026.1"]
    base_image: "quay.io/airshipit/horizon:{release}-ubuntu_noble"
    paths:
      - horizon/

  - name: nova
    dockerfile: nova/Dockerfile
    context: nova
    tag_template: "{release}-ubuntu_noble"
    releases: ["2025.1", "2026.1"]
    base_image: "quay.io/airshipit/nova:{release}-ubuntu_noble"
    paths:
      - nova/

  - name: octavia
    dockerfile: octavia/Dockerfile
    context: octavia
    tag_template: "{release}-ubuntu_noble"
    releases: ["2025.1", "2026.1"]
    base_image: "quay.io/airshipit/octavia:{release}-ubuntu_noble"
