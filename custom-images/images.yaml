    base_image: "quay.io/openstack.kolla/gnocchi-metricd:{release}-ubuntu-noble"
    paths:
      - gnocchi-metricd/

  # Standalone builds — different base images and versioning; bump the tools version here
  - name: openstack-tools
    dockerfile: openstack-tools/Dockerfile
    context: openstack-tools
    tag_template: "1.0-{release}"
    releases: ["2025.1", "2026.1"]
    base_image: "docker.io/library/ubuntu:24.04"
    paths:
      - openstack-tools/

  # SBOM discovery image - used to generate SBOMs for other images
  - name: sbom-discovery
    dockerfile: sbom-discovery/Dockerfile
    context: sbom-discovery
    tag_template: "1.0"
    base_image: "docker.io/library/alpine:3.24"
    paths:
      - sbom-discovery/

  - name: ceph
    dockerfile: ceph/Dockerfile
    context: ceph
    tag_template: "v19.2.2"
    base_image: "quay.io/ceph/ceph:v19.2.2"
